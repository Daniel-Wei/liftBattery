# Run CI for updates to the stable and integration branches.
trigger:
  branches:
    include:
      - main
      - develop

# Configure PR validation separately on the Azure Repos target branch.
pool:
  vmImage: ubuntu-latest

steps:
  # Check out the exact Azure Repos commit selected for this run.
  - checkout: self

  - task: UseDotNet@2
    displayName: Use .NET 11 SDK
    inputs:
      packageType: sdk
      version: '11.x'

  # Restore the API directly so the Functions SDK also restores its generated extension project.
  - script: dotnet restore backend/LiftBattery.Api/LiftBattery.Api.csproj
    displayName: Restore Azure Functions project and extensions

  - script: dotnet restore backend/LiftBattery.Api.Tests/LiftBattery.Api.Tests.csproj
    displayName: Restore .NET test project

  # The test project references the API, so this build still covers both projects.
  - script: >-
      dotnet build backend/LiftBattery.Api.Tests/LiftBattery.Api.Tests.csproj
      --configuration Release
      --no-restore
    displayName: Build .NET projects

  # Run the test assemblies from the preceding Release build.
  - script: >-
      dotnet test backend/LiftBattery.Api.Tests/LiftBattery.Api.Tests.csproj
      --configuration Release
      --no-build
      --no-restore
    displayName: Run backend tests

  - task: UseNode@1
    displayName: Use Node.js 24
    inputs:
      version: '24.x'

  # Install locked dependencies before running the frontend checks.
  - script: npm ci
    displayName: Install frontend dependencies
    workingDirectory: $(Build.SourcesDirectory)/client

  - script: npm test
    displayName: Run frontend tests
    workingDirectory: $(Build.SourcesDirectory)/client

  - script: npm run build
    displayName: Build frontend
    workingDirectory: $(Build.SourcesDirectory)/client

  # Notify GitHub only. The receiving workflow verifies the run and mirrors the commit.
  - bash: |
      set -euo pipefail

      # Reject missing secrets and unexpanded Azure Pipelines variables.
      if [[ -z "${MIRROR_DISPATCH_TOKEN:-}" ||
            "$MIRROR_DISPATCH_TOKEN" == '$('* ]]; then
        echo "GitHubMainMirrorDispatchToken must be configured as a secret pipeline variable."
        exit 1
      fi

      # Include only the build ID and SHA, not credentials or source files.
      payload="$(
        jq -cn \
          --arg build_id "$BUILD_BUILDID" \
          --arg sha "$BUILD_SOURCEVERSION" \
          '{
            event_type: "liftbattery-azure-main-validated",
            client_payload: {build_id: $build_id, sha: $sha}
          }'
      )"

      # Read the authorization header from stdin so the token is not a curl argument.
      status="$(
        curl \
          --silent \
          --show-error \
          --fail \
          --max-time 30 \
          --output /dev/null \
          --write-out '%{http_code}' \
          --header @- \
          --header 'Accept: application/vnd.github+json' \
          --header 'Content-Type: application/json' \
          --data-binary "$payload" \
          'https://api.github.com/repos/Daniel-Wei/liftBattery/dispatches' \
          <<< "Authorization: Bearer $MIRROR_DISPATCH_TOKEN"
      )"

      # HTTP 204 confirms that GitHub accepted the event, not that mirroring is complete.
      if [[ "$status" != "204" ]]; then
        echo "GitHub did not accept the mirror request (HTTP $status)."
        exit 1
      fi
    displayName: Request GitHub main sync (no deployment)
    # Keep this opt-in until the mirror credentials and a dry run have been verified.
    condition: >-
      and(succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest'),
      eq(variables['EnableGitHubMainMirror'], 'true'))
    env:
      # Configure this as a secret pipeline variable; never commit its value.
      MIRROR_DISPATCH_TOKEN: $(GitHubMainMirrorDispatchToken)
